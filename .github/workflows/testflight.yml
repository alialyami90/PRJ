name: TestFlight

# Archives the app on a macOS runner, signs it with Apple's cloud-managed distribution certificate and uploads
# it to App Store Connect, where it shows up in TestFlight once Apple has processed it.
#
# Signing needs no certificate or profile in the repo: the archive is built unsigned and `xcodebuild -exportArchive`
# signs it through the App Store Connect API key (-allowProvisioningUpdates), creating the App Store profile if needed.
# The key must have the Admin role, which cloud signing requires.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_KEY_ID     the key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID  the Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY        the whole text of the AuthKey_XXXXXXXXXX.p8 file
#   APPLE_TEAM_ID                the 10-character Team ID from developer.apple.com > Membership
#
# Pull requests that change this file only archive (no secrets, no upload), to check the release build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coloring-app/**", ".github/workflows/testflight.yml"]
  pull_request:
    paths: [".github/workflows/testflight.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an upload halfway; a newer push queues behind it.
  cancel-in-progress: false

defaults:
  run:
    working-directory: coloring-app

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 12.1 = run 12, first attempt. Every upload needs a higher build number than the last, re-runs included.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26 (App Store Connect only accepts builds made with the iOS 26 SDK or later)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -1)
          test -n "$xcode" || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check the App Store Connect secrets are set
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing APP_STORE_CONNECT_KEY"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -z "$missing" ] || { echo "::error::Missing repository secrets:$missing"; exit 1; }

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Archive (unsigned; signed at export)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SaudiColoring.xcodeproj -scheme SaudiColoring -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SaudiColoring.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-archive.log | grep -E "error:|warning: .*SaudiColoring|\*\* ARCHIVE"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties" "$RUNNER_TEMP/SaudiColoring.xcarchive/Info.plist"

      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          key_path="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key_path"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SaudiColoring.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee xcodebuild-export.log
          rm -f "$key_path"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight once App Store Connect has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Keep the logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: coloring-app/xcodebuild-*.log
