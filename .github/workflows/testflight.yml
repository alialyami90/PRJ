name: TestFlight

# Archives the app on a macOS runner, signs it with Apple's cloud-managed distribution certificate and uploads
# it to App Store Connect, where it shows up in TestFlight once Apple has processed it.
#
# Signing needs no certificate or profile in the repo: the archive is built unsigned and `xcodebuild -exportArchive`
# signs it through the App Store Connect API key (-allowProvisioningUpdates), creating the App Store profile if needed.
# The key must have the Admin role, which cloud signing requires.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APP_STORE_CONNECT_KEY_ID     the key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID  the Issuer ID shown above the keys list
#   APP_STORE_CONNECT_KEY        the whole text of the AuthKey_XXXXXXXXXX.p8 file
#   APPLE_TEAM_ID                the 10-character Team ID from developer.apple.com > Membership
#
# Pull requests that change this file or project.yml only archive (no secrets, no upload), to check the release build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coloring-app/**", ".github/workflows/testflight.yml"]
  pull_request:
    paths: [".github/workflows/testflight.yml", "coloring-app/project.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an upload halfway; a newer push queues behind it.
  cancel-in-progress: false

defaults:
  run:
    working-directory: coloring-app

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 12.1 = run 12, first attempt. Every upload needs a higher build number than the last, re-runs included.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      UPLOAD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26 (App Store Connect only accepts builds made with the iOS 26 SDK or later)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -1)
          test -n "$xcode" || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check the App Store Connect secrets are set and look right
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only the shape of each value is checked and reported, never the value.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          KEY_ID=$(trim "$KEY_ID"); ISSUER_ID=$(trim "$ISSUER_ID"); TEAM_ID=$(trim "$TEAM_ID")
          bad=0
          problem() { echo "::error::$1"; bad=1; }
          [ -n "$KEY_ID" ] || problem "APP_STORE_CONNECT_KEY_ID is not set"
          [ -n "$ISSUER_ID" ] || problem "APP_STORE_CONNECT_ISSUER_ID is not set"
          [ -n "$KEY" ] || problem "APP_STORE_CONNECT_KEY is not set"
          [ -n "$TEAM_ID" ] || problem "APPLE_TEAM_ID is not set"
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$KEY_ID" ] && ! [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            if [[ "$KEY_ID" =~ $uuid ]]; then problem "APP_STORE_CONNECT_KEY_ID holds the Issuer ID (the long one with dashes); the Key ID is the 10-character one in the key's row"
            else problem "APP_STORE_CONNECT_KEY_ID should be 10 capital letters and digits (it has ${#KEY_ID} characters)"; fi
          fi
          if [ -n "$ISSUER_ID" ] && ! [[ "$ISSUER_ID" =~ $uuid ]]; then
            problem "APP_STORE_CONNECT_ISSUER_ID should look like 69a6de7f-xxxx-xxxx-xxxx-xxxxxxxxxxxx, shown above the Team Keys list (it has ${#ISSUER_ID} characters)"
          fi
          if [ -n "$TEAM_ID" ] && ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            problem "APPLE_TEAM_ID should be 10 capital letters and digits (it has ${#TEAM_ID} characters)"
          fi
          if [ -n "$KEY" ]; then
            grep -q -- '-----BEGIN PRIVATE KEY-----' <<<"$KEY" && grep -q -- '-----END PRIVATE KEY-----' <<<"$KEY" \
              || problem "APP_STORE_CONNECT_KEY should be the whole .p8 file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----"
          fi
          exit $bad

      - name: Check the API key with App Store Connect
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUNDLE_ID: com.yamiapps.saudicolors
        run: |
          export KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          export ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          export KEY_PATH="$RUNNER_TEMP/check.p8"
          printf '%s\n' "$KEY" > "$KEY_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          status=0
          "$RUNNER_TEMP/venv/bin/python" Scripts/check_asc_key.py || status=$?
          rm -f "$KEY_PATH"
          exit $status

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Archive (unsigned; signed at export)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SaudiColoring.xcodeproj -scheme SaudiColoring -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SaudiColoring.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-archive.log | grep -E "error:|warning: .*SaudiColoring|\*\* ARCHIVE"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties" "$RUNNER_TEMP/SaudiColoring.xcarchive/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$RUNNER_TEMP/SaudiColoring.xcarchive/Info.plist")
          [ "$built" = "$BUILD_NUMBER" ] || { echo "::error::Built $built, expected build number $BUILD_NUMBER (CFBundleVersion must be \$(CURRENT_PROJECT_VERSION))"; exit 1; }

      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Copying from a web page often brings a stray space or line break along.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          TEAM_ID=$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')
          key_path="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$key_path"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SaudiColoring.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee xcodebuild-export.log
          rm -f "$key_path"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight once App Store Connect has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Keep the logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: coloring-app/xcodebuild-*.log
