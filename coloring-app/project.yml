name: SaudiColoring
options:
  bundleIdPrefix: com.alialyami
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_LANGUAGE: en
targets:
  SaudiColoring:
    type: application
    platform: iOS
    sources:
      - path: SaudiColoring
    info:
      path: SaudiColoring/App/Info.plist
      properties:
        CFBundleDisplayName: Saudi Colors
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        CFBundleLocalizations: [en, ar]
        NSUserTrackingUsageDescription: ""
        SKAdNetworkItems: []
        GADApplicationIdentifier: "ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alialyami.saudicolors
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    # Uncomment when wiring ads:
    # dependencies:
    #   - package: GoogleMobileAds
  SaudiColoringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SaudiColoringTests
    dependencies:
      - target: SaudiColoring
# packages:
#   GoogleMobileAds:
#     url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
#     from: "11.0.0"
schemes:
  SaudiColoring:
    build:
      targets:
        SaudiColoring: all
        SaudiColoringTests: [test]
    test:
      targets:
        - SaudiColoringTests
