name: SaudiColoring
options:
  bundleIdPrefix: com.alialyami
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0" # language mode; Xcode only accepts 4.0, 4.2, 5.0, 6.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_LANGUAGE: en
targets:
  SaudiColoring:
    type: application
    platform: iOS
    sources:
      - path: SaudiColoring
        excludes:
          - "Resources/Scenes"
          - "Resources/Scenes/**"
          - "Resources/SampleScene"
          - "Resources/SampleScene/**"
      # Folder references keep the <region>/<scene>/ layout in the bundle (SceneAssets looks files up by subdirectory).
      - path: SaudiColoring/Resources/Scenes
        type: folder
      - path: SaudiColoring/Resources/SampleScene
        type: folder
    info:
      path: SaudiColoring/App/Info.plist
      properties:
        CFBundleDisplayName: Saudi Colors
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        CFBundleLocalizations: [en, ar]
        # Only standard HTTPS (exempt), so App Store Connect doesn't ask the export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: ""
        SKAdNetworkItems: []
        # Google's test app id; replace with the app's own from the AdMob console before release.
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alialyami.saudicolors
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    # Uncomment to turn on AdMob (Services/Ads/AdMobAdService.swift compiles once the package is present):
    # dependencies:
    #   - package: GoogleMobileAds
  SaudiColoringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SaudiColoringTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SaudiColoring
  # Screenshots of the main screens with demo progress (see Tests/SaudiColoringUITests/ScreenshotTests.swift).
  SaudiColoringUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SaudiColoringUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SaudiColoring
# packages:
#   GoogleMobileAds:
#     url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
#     exactVersion: "11.13.0" # AdMobAdService is written against the 11.x API
schemes:
  SaudiColoring:
    build:
      targets:
        SaudiColoring: all
        SaudiColoringTests: [test]
    test:
      targets:
        - SaudiColoringTests
  # Not part of the regular test run: `xcodebuild test -scheme Screenshots` (see .github/workflows/screenshots.yml).
  Screenshots:
    build:
      targets:
        SaudiColoring: all
        SaudiColoringUITests: [test]
    test:
      targets:
        - SaudiColoringUITests
